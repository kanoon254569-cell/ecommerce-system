version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16
    container_name: ecommerce_postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
      POSTGRES_DB: ecommerce_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network

  # FastAPI Application
  fastapi:
    build: .
    container_name: ecommerce_fastapi
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ecommerce:ecommerce@postgres:5432/ecommerce_db
      DATABASE_NAME: ecommerce_db
      SECRET_KEY: your-secret-key-change-in-production
      DEBUG: "True"
    volumes:
      - ./backend:/app/backend  # For live reloading during development
      - ./frontend:/app/frontend  # Frontend HTML files
    networks:
      - ecommerce-network
    command: python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:

networks:
  ecommerce-network:
    driver: bridge
